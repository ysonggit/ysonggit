  .ln { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ac { fill: #d97757; } .acl { stroke: #d97757; fill: none; stroke-width: 2; stroke-linecap: round; }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s ease-in-out infinite; }@keyframes blink { 0%,88%,100% { transform: scaleY(1); } 93% { transform: scaleY(.08); } }
</style>

