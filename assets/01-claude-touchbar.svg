<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-label="01 claude-touchbar: Claude Code's status and usage meters on a 2016 MacBook Pro Touch Bar under Linux. Tap to allow.">

<style>
  .fg { fill: #1f2328; } .mut { fill: #656d76; } .ln { stroke: #1f2328; } .bd { stroke: #d0d7de; }
  @media (prefers-color-scheme: dark) {
    .fg { fill: #e6edf3; } .mut { fill: #8d96a0; } .ln { stroke: #e6edf3; } .bd { stroke: #30363d; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ac { fill: #d97757; } .acl { stroke: #d97757; fill: none; stroke-width: 2; stroke-linecap: round; }
  .seg { animation: slide 3s ease-in-out infinite alternate; }@keyframes slide { from { transform: translateX(0); } to { transform: translateX(62px); } }
</style>

  <rect class="bd" x="1" y="1" width="418" height="178" rx="10" fill="none"/>
  <g transform="translate(24 40)">
  <rect class="ln" x="4" y="30" width="92" height="40" rx="4"/>
  <rect class="ln" x="10" y="42" width="80" height="12" rx="3"/>
  <rect class="ac seg" x="12" y="44" width="14" height="8" rx="2"/>
  <line class="ln" x1="14" y1="62" x2="86" y2="62" stroke-dasharray="4 4"/>
  </g>
  <text class="mut mono" x="150" y="48" font-size="12">01</text>
  <text class="fg" x="150" y="76" font-size="18" font-weight="600">claude-touchbar</text>
  <text class="mut" x="150" y="104" font-size="13">Claude Code's status and usage</text>
  <text class="mut" x="150" y="123" font-size="13">meters on a 2016 MacBook Pro Touch</text>
  <text class="mut" x="150" y="142" font-size="13">Bar under Linux. Tap to allow.</text>
</svg>
