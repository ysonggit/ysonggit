<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-label="02 agent-control-surface: A small USB device by the keyboard. Shows what the agent is doing and takes Allow / Deny.">

<style>
  .fg { fill: #1f2328; } .mut { fill: #656d76; } .ln { stroke: #1f2328; } .bd { stroke: #d0d7de; }
  @media (prefers-color-scheme: dark) {
    .fg { fill: #e6edf3; } .mut { fill: #8d96a0; } .ln { stroke: #e6edf3; } .bd { stroke: #30363d; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ac { fill: #d97757; } .acl { stroke: #d97757; fill: none; stroke-width: 2; stroke-linecap: round; }
  .led { animation: blink 1.6s ease-in-out infinite; }@keyframes blink { 50% { opacity: .15; } }
</style>

  <rect class="bd" x="1" y="1" width="418" height="178" rx="10" fill="none"/>
  <g transform="translate(24 40)">
  <rect class="ln" x="18" y="14" width="64" height="72" rx="10"/>
  <rect class="ln" x="28" y="24" width="44" height="30" rx="3"/>
  <circle class="ac led" cx="50" cy="39" r="4"/>
  <rect class="ln" x="28" y="64" width="18" height="10" rx="3"/>
  <rect class="ac" x="54" y="64" width="18" height="10" rx="3"/>
  </g>
  <text class="mut mono" x="150" y="48" font-size="12">02</text>
  <text class="fg" x="150" y="76" font-size="18" font-weight="600">agent-control-surface</text>
  <text class="mut" x="150" y="104" font-size="13">A small USB device by the keyboard.</text>
  <text class="mut" x="150" y="123" font-size="13">Shows what the agent is doing and</text>
  <text class="mut" x="150" y="142" font-size="13">takes Allow / Deny.</text>
</svg>
