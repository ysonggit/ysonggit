  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ac { fill: #d97757; } .acl { stroke: #d97757; fill: none; stroke-width: 2; stroke-linecap: round; }
  .trend { animation: draw 3.2s ease-in-out infinite; }@keyframes draw { 0% { stroke-dashoffset: 110; } 60%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 110; } }
