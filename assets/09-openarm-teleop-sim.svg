<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" role="img" aria-label="09 openarm-teleop-sim: OpenArm in MuJoCo, driven from a browser. Arms follow at a capped speed and hold if commands stop.">

<style>
  .fg { fill: #1f2328; } .mut { fill: #656d76; } .ln { stroke: #1f2328; } .bd { stroke: #d0d7de; }
  @media (prefers-color-scheme: dark) {
    .fg { fill: #e6edf3; } .mut { fill: #8d96a0; } .ln { stroke: #e6edf3; } .bd { stroke: #30363d; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ac { fill: #d97757; } .acl { stroke: #d97757; fill: none; stroke-width: 2; stroke-linecap: round; }
  .goal, .arm { transform-origin: 22px 52px; }.goal { animation: goal 6s infinite; } .arm { animation: arm 6s linear infinite; }@keyframes goal { 0%,49.9% { transform: rotate(-40deg); } 50%,100% { transform: rotate(0); } }@keyframes arm { 0%,5% { transform: rotate(0); } 40%,55% { transform: rotate(-40deg); } 90%,100% { transform: rotate(0); } }
</style>

