<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" role="img" aria-label="04 meeting-copilot: Live meeting transcription, German first, with answer suggestions. Audio never touches disk.">

<style>
  .fg { fill: #1f2328; } .mut { fill: #656d76; } .ln { stroke: #1f2328; } .bd { stroke: #d0d7de; }
  @media (prefers-color-scheme: dark) {
    .fg { fill: #e6edf3; } .mut { fill: #8d96a0; } .ln { stroke: #e6edf3; } .bd { stroke: #30363d; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .ln { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ac { fill: #d97757; } .acl { stroke: #d97757; fill: none; stroke-width: 2; stroke-linecap: round; }
  .bar { transform-box: fill-box; transform-origin: center; animation: talk 1.1s ease-in-out infinite; }@keyframes talk { 0%,100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }
</style>

  <rect class="bd" x="1" y="1" width="278" height="208" rx="10" fill="none"/>
  <g transform="translate(20 18) scale(.72)">
  <line class="ln" x1="4" y1="50" x2="96" y2="50" stroke-opacity=".15"/>
  <rect class="ac bar" style="animation-delay:-0.00s" x="8" y="30" width="5" height="40" rx="2.5"/>
  <rect class="ac bar" style="animation-delay:-0.17s" x="19" y="30" width="5" height="40" rx="2.5"/>
  <rect class="ac bar" style="animation-delay:-0.34s" x="30" y="30" width="5" height="40" rx="2.5"/>
  <rect class="ac bar" style="animation-delay:-0.51s" x="41" y="30" width="5" height="40" rx="2.5"/>
  <rect class="ac bar" style="animation-delay:-0.68s" x="52" y="30" width="5" height="40" rx="2.5"/>
  <rect class="ac bar" style="animation-delay:-0.85s" x="63" y="30" width="5" height="40" rx="2.5"/>
  <rect class="ac bar" style="animation-delay:-1.02s" x="74" y="30" width="5" height="40" rx="2.5"/>
  <rect class="ac bar" style="animation-delay:-1.19s" x="85" y="30" width="5" height="40" rx="2.5"/>
  </g>
  <text class="mut mono" x="260" y="36" font-size="12" text-anchor="end">04</text>
  <text class="fg" x="20" y="118" font-size="17" font-weight="600">meeting-copilot</text>
  <text class="mut" x="20" y="144" font-size="13">Live meeting transcription, German</text>
  <text class="mut" x="20" y="163" font-size="13">first, with answer suggestions.</text>
  <text class="mut" x="20" y="182" font-size="13">Audio never touches disk.</text>
</svg>
